  <link rel="preconnect" href="https://res.cloudinary.com">

  <title>LeadDistro | Smart lead distribution for HubSpot, GHL and monday</title>
  <meta name="description"
    content="Automate lead assignment in HubSpot, GoHighLevel and monday.com with LeadDistro. Set limits per sales rep, split leads between teams by percentage and automate your sales flow. USD 25/month, 7-day free trial." />
  <meta name="keywords"
    content="lead distribution hubspot, ghl round robin alternative, monday.com crm integration, automatic lead assignment, leaddistro, sales team management, crm webhook automation" />
  <meta name="author" content="LeadDistro" />
  <meta name="robots" content="index, follow" />
  <meta property="og:site_name" content="LeadDistro" />
  <!-- Nombre del sitio en Google (debe estar en el HTML estático de la home) -->
  <script type="application/ld+json">
    {"@context":"https://schema.org","@type":"WebSite","@id":"https://www.leaddistro.site/#website","name":"LeadDistro","alternateName":["Lead Distro","leaddistro.site"],"url":"https://www.leaddistro.site/"}
  </script>
  <script>
    // Initialize dark mode before page renders to prevent flash
    (function () {
      const savedDarkMode = localStorage.getItem('darkMode');
      const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const isDark = savedDarkMode ? savedDarkMode === 'true' : systemPrefersDark;
      if (isDark) {
        document.documentElement.classList.add('dark');
        document.documentElement.style.colorScheme = 'dark';
      } else {
        document.documentElement.style.colorScheme = 'light';
      }
    })();
  </script>


  <!-- Google tag (gtag.js) - Deferred loading -->
  <script>
    window.addEventListener('load', () => {
      setTimeout(() => {
        const script = document.createElement('script');
        script.src = "https://www.googletagmanager.com/gtag/js?id=G-GXBJE7ZV0W";
        script.async = true;
        document.head.appendChild(script);

        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-GXBJE7ZV0W');
      }, 3500); // 3.5s delay to allow LCP and interactive states to stabilize
    });
  </script>
</head>
